name = "plausible-mcp"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
# nodejs_compat_v2: Node built-ins for the SDK. global_fetch_strictly_public: hardens
# the JWKS fetch — fetch() can only reach public addresses, blocking SSRF.
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]

# Ghostery runs the BYOK /mcp endpoint only, so no custom domain is required — the first
# deploy lands on plausible-mcp.<account>.workers.dev. To front it with a custom domain,
# put the zone on Cloudflare and uncomment (most-specific route wins):
# routes = [
#   { pattern = "plausible-mcp.ghostery.com", custom_domain = true }
# ]

[vars]
# Default Plausible site so BYOK callers never have to pass site_id (team queries one site).
PLAUSIBLE_DEFAULT_SITE_ID = "ghostery.com"

# --- /internal (SSO connector) config — DORMANT ---
# We deploy /mcp only; /internal fails closed without these + a Cloudflare Access app in
# front. Left here as a stub in case Ghostery later enables the managed-connector endpoint.
ALLOWED_EMAIL_DOMAIN = "ghostery.com"
# CF_ACCESS_TEAM_DOMAIN = "https://<team>.cloudflareaccess.com"  # no trailing slash
# CF_ACCESS_AUD = "<Ghostery /internal Access application AUD>"

[dev]
port = 8787

# With Managed OAuth, Cloudflare Access runs the OAuth server; the Worker only verifies
# the assertion Access injects, so no OAuth client id/secret, cookie key, or KV is needed.
# The one true secret is the shared Plausible key — set it out-of-band, not in this file:
#   wrangler secret put PLAUSIBLE_API_KEY
# Optional: the Worker's own Sentry telemetry. Deliberately a secret rather than a var so
# forks of this repo don't report into someone else's Sentry project. Unset = SDK disabled.
#   wrangler secret put SENTRY_DSN

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
