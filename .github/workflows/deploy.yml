name: Deploy

# Ghostery-only: push to the ghostery branch deploys the Worker to Cloudflare.
# Not sent upstream — deployment is this fork's concern.
on:
  push:
    branches:
      - ghostery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ghostery
  cancel-in-progress: false

jobs:
  deploy:
    name: test + deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.114.0"

      - name: Deploy skipped (secrets missing)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Deploy skipped — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable auto-deploy on push."
